<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Longitudinal MRI brain atrophy analysis</title>
  <desc id="desc">Publication graphic showing MRI scans moving through alignment, structural measurement, and longitudinal change analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#17212d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d9c8"/>
      <stop offset="1" stop-color="#8fb8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <text x="94" y="102" fill="#66d9c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" letter-spacing="4">PUBLISHED MEDICAL-IMAGING RESEARCH</text>
  <text x="94" y="190" fill="#f6f2e9" font-family="Georgia, serif" font-size="64" font-weight="700">Brain Atrophy Analysis</text>
  <text x="94" y="252" fill="#b9c5d3" font-family="Arial, sans-serif" font-size="31">Longitudinal MRI · Computer vision · Quantitative measurement</text>

  <g transform="translate(94 350)" filter="url(#shadow)">
    <rect width="310" height="330" rx="28" fill="#202c39" stroke="#3f5368" stroke-width="2"/>
    <ellipse cx="155" cy="145" rx="104" ry="119" fill="#cfd6dd"/>
    <ellipse cx="155" cy="145" rx="86" ry="101" fill="#707d89"/>
    <path d="M112 102c20-30 66-30 86 0 13 19 9 44-9 58-10 8-20 14-34 14s-24-6-34-14c-18-14-22-39-9-58z" fill="#18212b"/>
    <path d="M104 214c31 17 71 17 102 0" fill="none" stroke="#aeb8c1" stroke-width="11" stroke-linecap="round"/>
    <text x="32" y="300" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="24">MRI at time 1</text>
  </g>

  <path d="M434 515h120" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M538 497l28 18-28 18" fill="none" stroke="#8fb8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(590 350)" filter="url(#shadow)">
    <rect width="310" height="330" rx="28" fill="#202c39" stroke="#3f5368" stroke-width="2"/>
    <circle cx="155" cy="130" r="84" fill="none" stroke="#66d9c8" stroke-width="7"/>
    <path d="M93 130h124M155 68v124" stroke="#526677" stroke-width="3"/>
    <path d="M109 102c20-29 72-29 92 0 15 22 9 51-12 66-10 7-21 13-34 13s-24-6-34-13c-21-15-27-44-12-66z" fill="none" stroke="#f6f2e9" stroke-width="6"/>
    <text x="32" y="278" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="24">Align &amp; measure</text>
    <text x="32" y="310" fill="#9eabb8" font-family="Arial, sans-serif" font-size="19">Structural regions</text>
  </g>

  <path d="M930 515h120" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1034 497l28 18-28 18" fill="none" stroke="#8fb8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1086 350)" filter="url(#shadow)">
    <rect width="420" height="330" rx="28" fill="#202c39" stroke="#3f5368" stroke-width="2"/>
    <path d="M52 214C107 197 132 153 180 170s74-54 119-32 52-46 76-67" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="214" r="10" fill="#66d9c8"/>
    <circle cx="180" cy="170" r="10" fill="#70d1d2"/>
    <circle cx="299" cy="138" r="10" fill="#7ac9e6"/>
    <circle cx="375" cy="71" r="10" fill="#8fb8ff"/>
    <text x="38" y="278" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="24">Quantify change</text>
    <text x="38" y="310" fill="#9eabb8" font-family="Arial, sans-serif" font-size="19">Longitudinal atrophy signal</text>
  </g>

  <rect x="94" y="786" width="1412" height="120" rx="24" fill="#111a24" stroke="#304052"/>
  <text x="132" y="836" fill="#f6f2e9" font-family="Arial, sans-serif" font-size="27" font-weight="700">Analyzing Brain Atrophy in Dementia Using Computer Vision</text>
  <text x="132" y="876" fill="#9eabb8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">IEEE ICRITO 2022 · DOI 10.1109/ICRITO56286.2022.9964994</text>
